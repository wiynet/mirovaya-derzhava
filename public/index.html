<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Мировая держава — онлайн-стратегия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=PT+Serif:wght@700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --ocean:#cfdde4; --ocean2:#c3d3db;
  --ink:#1d2a33; --ink2:#4a5a66; --ink3:#7d8b95;
  --paper:#fbfaf6; --line:#e6e2d8;
  --accent:#c4552d; --accent2:#e8a07f;
  --sel:#1f5f8b;
  --shadow:0 10px 30px rgba(20,35,45,.16),0 2px 6px rgba(20,35,45,.08);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ocean);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
#map.hand{cursor:pointer}
button{font:inherit;color:inherit}

/* ---------- search ---------- */
#searchWrap{position:fixed;left:16px;top:16px;width:340px;max-width:calc(100vw - 32px);z-index:20}
#searchBox{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:var(--r);
  box-shadow:var(--shadow);padding:0 14px;height:50px;border:1px solid rgba(0,0,0,.04)}
#searchBox svg{flex:none;color:var(--ink3)}
#q{flex:1;border:0;outline:0;background:transparent;font:500 15px Manrope,system-ui,sans-serif;color:var(--ink);min-width:0}
#q::placeholder{color:var(--ink3)}
#qClear{border:0;background:none;cursor:pointer;color:var(--ink3);font-size:20px;line-height:1;padding:4px;display:none}
#results{margin-top:8px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
#results .grp{font:700 11px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:12px 14px 4px}
#results .it{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}
#results .it:hover,#results .it.act{background:#f1ede3}
#results .fl{font-size:20px;width:26px;text-align:center}
#results .nm{font-weight:600;font-size:14px}
#results .sub{font-size:12px;color:var(--ink3)}
#results .empty{padding:14px;color:var(--ink3);font-size:14px}

/* ---------- country card (under search) ---------- */
#ccard{margin-top:10px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:none}
#ccard .top{display:flex;gap:12px;align-items:center}
#ccard .flag{font-size:34px;line-height:1}
#ccard h3{margin:0;font:700 19px "PT Serif",Georgia,serif}
#ccard .meta{font-size:12.5px;color:var(--ink3);margin-top:2px}
#ccard .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
#ccard .mini div{background:#f3efe6;border-radius:10px;padding:9px 10px}
#ccard .mini b{display:block;font-size:15px}
#ccard .mini span{font-size:11.5px;color:var(--ink3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:11px;padding:12px 14px;
  background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{background:#2e4250}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:#efebe2;cursor:pointer;font-size:18px;line-height:32px;color:var(--ink2)}
.x:hover{background:#e4dfd3}

/* ---------- city panel ---------- */
#cityPanel{position:fixed;right:16px;top:16px;width:360px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow-y:auto;
  background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);z-index:25;padding:20px 20px 18px;
  transform:translateX(calc(100% + 30px));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#cityPanel.open{transform:none}
#cityPanel .kicker{font:700 11px Manrope,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
#cityPanel h2{margin:6px 40px 2px 0;font:700 26px/1.15 "PT Serif",Georgia,serif}
#cityPanel .en{color:var(--ink3);font-size:13.5px}
#cityPanel .ctry{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:999px;background:#f1ede3;
  cursor:pointer;font-weight:600;font-size:13px;border:0}
#cityPanel .ctry:hover{background:#e7e1d3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:#f3efe6;border-radius:11px;padding:10px 12px}
.stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.stat span{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.rows{border-top:1px solid var(--line);margin-top:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row span:first-child{color:var(--ink3)}
.row span:last-child{text-align:right;font-weight:600}
.note{font-size:11.5px;color:var(--ink3);line-height:1.45;margin-top:10px}
.lnk{color:var(--sel);font-weight:600;text-decoration:none}
.lnk:hover{text-decoration:underline}
.hist{margin-top:14px}
.hist h4,.sec h4{margin:0 0 8px;font-size:13px;font-weight:700}

/* ---------- controls ---------- */
#zoomCtl{position:fixed;right:16px;bottom:24px;display:flex;flex-direction:column;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:15}
#zoomCtl button{width:42px;height:42px;border:0;background:none;cursor:pointer;font-size:20px;color:var(--ink2)}
#zoomCtl button:hover{background:#f1ede3}
#zoomCtl button+button{border-top:1px solid var(--line)}
#legend{position:fixed;left:16px;bottom:16px;background:rgba(251,250,246,.92);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink2);z-index:14;box-shadow:0 2px 10px rgba(0,0,0,.08);line-height:1.6}
#legend i{display:inline-block;vertical-align:-2px;margin-right:6px}
#legend .d1{width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid #fff;box-shadow:0 0 0 1px var(--ink)}
#legend .d2{width:14px;height:10px;background:linear-gradient(90deg,hsl(200 55% 77%) 46%,rgba(45,40,35,.6) 46%,rgba(45,40,35,.6) 54%,hsl(200 55% 77%) 54%);border:1px solid rgba(40,35,30,.6);border-radius:2px}
#legend .d3{width:12px;height:10px;background:rgba(40,30,25,.18);border:1px solid rgba(40,30,25,.45);border-radius:40%}
#legend small{color:var(--ink3)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:8px;z-index:30;display:none;white-space:nowrap}
#tip small{font-weight:500;opacity:.75}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--ocean);z-index:100;font-weight:600;color:var(--ink2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.1);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- country page ---------- */
#cpage{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;display:none}
#cpage.open{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cp-in{max-width:1120px;margin:0 auto;padding:28px 28px 60px}
.cp-bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--paper);padding:14px 0;z-index:3;border-bottom:1px solid var(--line);margin:-28px 0 24px}
.back{display:inline-flex;align-items:center;gap:8px;border:0;background:#efebe2;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;font-size:13.5px}
.back:hover{background:#e4dfd3}
.cp-bar .crumb{color:var(--ink3);font-size:13.5px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:stretch}
.hero h1{font:700 46px/1.05 "PT Serif",Georgia,serif;margin:6px 0 6px;letter-spacing:-.01em}
.hero .flag{font-size:54px;line-height:1}
.hero .formal{color:var(--ink3);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#f1ede3;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
#miniMap{width:100%;height:100%;min-height:260px;border-radius:16px;background:var(--ocean);display:block}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}
.tile{background:#f3efe6;border-radius:14px;padding:16px}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.tile span{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px}
.tile em{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{margin:0 0 14px;font:700 19px "PT Serif",Georgia,serif}
.meter{height:12px;border-radius:999px;background:linear-gradient(90deg,#d9634a,#e8b04a 45%,#79b26a 75%,#2f8f6b);position:relative;margin:26px 0 8px}
.meter .pin{position:absolute;top:-8px;width:4px;height:28px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.meter .pin b{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:3px 8px;border-radius:7px;font-size:13px;white-space:nowrap}
.meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.dev-big{font-size:15px;margin-top:14px}
.bars .b{display:grid;grid-template-columns:130px 1fr 74px;gap:10px;align-items:center;font-size:13px;padding:4px 0;cursor:pointer;border-radius:6px}
.bars .b:hover .nm{color:var(--sel)}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars .tr{height:14px;background:#f1ede3;border-radius:4px;overflow:hidden}
.bars .fi{height:100%;background:var(--accent);border-radius:4px}
.bars .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.buckets{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:6px}
.buckets .bk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.buckets .col{width:100%;background:var(--sel);border-radius:6px 6px 0 0;min-height:2px;opacity:.85}
.buckets .n{font-weight:800;font-size:13px}
.buckets .l{font-size:11px;color:var(--ink3);text-align:center;line-height:1.2}
.tblHead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:34px 0 12px;flex-wrap:wrap}
.tblHead h2{margin:0;font:700 26px "PT Serif",Georgia,serif}
.tblHead input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 14px Manrope,sans-serif;width:260px;background:#fff;outline:0}
.tblHead input:focus{border-color:var(--ink3)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700;padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:10px 10px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f5f2ea}
td .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f9e1d6;color:var(--accent);margin-left:6px}
td .tag.r{background:#e1ebf3;color:var(--sel)}
.share{display:inline-block;width:60px;height:6px;background:#f1ede3;border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.share i{display:block;height:100%;background:var(--sel)}
.src{margin-top:30px;font-size:12px;color:var(--ink3);line-height:1.6}


/* ---------- game ---------- */
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{padding:14px;font-size:15px;margin-top:10px}
.btn.ghost{background:#efebe2;color:var(--ink)}
.btn.ghost:hover{background:#e4dfd3}
.owner{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin:10px 0 4px}
.owner i,.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.15)}
.owner i{margin-right:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats3 .stat{padding:9px 10px}
.stats3 .stat b{font-size:15px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:0;border-radius:11px;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;padding:11px 12px;cursor:pointer;text-align:left;line-height:1.25}
.act small{display:block;font-weight:500;font-size:11.5px;opacity:.75;margin-top:2px}
.act:hover{background:#2e4250}
.act.sm{text-align:center;padding:9px 6px}
.act.red{background:#b8372b}.act.red:hover{background:#9e2c22}
.act.blue{background:var(--sel)}.act.blue:hover{background:#174c70}
.act.nuke{background:#e2b007;color:#1d1a10}.act.nuke:hover{background:#c99c00}
.act[disabled]{opacity:.4;cursor:not-allowed}
#cityPanel h2{font-size:24px;margin-top:0}
#cityPanel{padding-top:18px}
#hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:22;display:none;align-items:center;gap:6px;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:6px 8px;white-space:nowrap;max-width:calc(100vw - 32px)}
.h-ct{padding:6px 10px;font-size:14px}
.h-it,.h-btn{display:flex;align-items:baseline;gap:5px;padding:7px 10px;border-radius:10px;background:#f3efe6;font-size:14px;border:0}
.h-it small,.h-btn small{font-size:11.5px;color:var(--ink3);font-weight:600}
.h-btn{cursor:pointer}.h-btn:hover{background:#e7e1d3}
#server{position:fixed;right:16px;bottom:150px;z-index:14;background:rgba(251,250,246,.94);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.08);display:none}
#banner{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:21;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;display:none;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
#banner a{color:#ffd48a}
body[data-mode="choose"] #banner{top:16px}
#toast{position:fixed;left:50%;top:132px;transform:translate(-50%,-10px);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#b8372b}
#toast.nuke{background:#e2b007;color:#1d1a10}
#news{position:fixed;left:16px;bottom:16px;z-index:14;width:330px;max-width:calc(100vw - 32px);display:none;pointer-events:none}
.nw{background:rgba(251,250,246,.93);border-radius:9px;padding:7px 10px;font-size:12.5px;margin-top:5px;box-shadow:0 2px 8px rgba(0,0,0,.07);line-height:1.35}
.nw.war{border-left:3px solid #b8372b}.nw.nuke{border-left:3px solid #e2b007;font-weight:700}.nw.claim{border-left:3px solid var(--sel)}
.side{position:fixed;top:84px;left:50%;transform:translateX(-50%);width:380px;max-width:calc(100vw - 32px);max-height:calc(100vh - 110px);overflow-y:auto;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;z-index:26;display:none}
.side.open{display:block}
.side h3{margin:0 0 12px;font:700 19px "PT Serif",Georgia,serif}
.prog{height:12px;border-radius:999px;background:#efebe2;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,#e2b007,#c4552d)}
.blist{display:flex;flex-direction:column;gap:4px}
.brow{display:grid;grid-template-columns:22px auto 1fr auto;align-items:center;gap:6px;padding:8px;border-radius:10px;cursor:pointer;font-size:13.5px}
.brow:hover{background:#f3efe6}.brow.me{background:#eef4f9}
.brow .bn{color:var(--ink3);font-weight:700}
.bname{font-weight:700;overflow:hidden;text-overflow:ellipsis}.bname small,.bv small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3)}
.bv{text-align:right;font-weight:700}
#modal{position:fixed;inset:0;z-index:70;background:rgba(20,28,34,.35);display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
#modalBox{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:20px;width:400px;max-width:calc(100vw - 32px)}
#modalBox h3{margin:0 0 8px;font:700 20px "PT Serif",Georgia,serif}
.fld{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
.fld select,.fld input[type=range]{display:block;width:100%;margin-top:6px}
.fld select{padding:9px;border-radius:9px;border:1px solid var(--line);font:500 13.5px Manrope,sans-serif;background:#fff}
#modalBox .row2{margin-top:14px}
#modalBox .act{text-align:center}
#start{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(207,221,228,.55);backdrop-filter:blur(3px)}
.st-card{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:30px 28px;width:400px;max-width:calc(100vw - 32px);text-align:center}
.st-logo{font-size:46px}
.st-card h1{font:700 32px "PT Serif",Georgia,serif;margin:6px 0 8px}
.st-card p{color:var(--ink2);font-size:14.5px;line-height:1.5;margin:0 0 16px}
.st-card input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);font:600 15px Manrope,sans-serif;outline:0;background:#fff}
.st-card input:focus{border-color:var(--ink3)}
.st-status{font-size:12.5px;color:var(--ink3);margin-top:14px;line-height:1.45}
body[data-mode="start"] #searchWrap,body[data-mode="start"] #zoomCtl{visibility:hidden}
@media (max-width:640px){
  #hud{top:auto;bottom:10px;gap:4px;padding:5px;overflow-x:auto;justify-content:flex-start;left:16px;transform:none;right:16px}
  .h-ct{display:none}
  .h-it,.h-btn{padding:6px 8px;font-size:13px}
  #news{display:none!important}
  #server{bottom:auto;top:84px;right:auto;left:16px}
  body.city-open #hud{display:none!important}
  #banner{top:76px}
}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .hero h1{font-size:34px}
  .cp-in{padding:20px 16px 50px}
  .cp-bar{margin:-20px 0 18px}
  .bars .b{grid-template-columns:100px 1fr 64px}
  .col-reg{display:none}
}
@media (max-width:640px){
  #cityPanel{top:auto;bottom:0;right:0;left:0;width:100%;max-width:100%;max-height:62vh;border-radius:18px 18px 0 0;transform:translateY(105%)}
  #cityPanel.open{transform:none}
  #legend{display:none}
  #zoomCtl{bottom:auto;top:84px}
  #searchWrap{width:calc(100vw - 32px)}
  body.city-open #ccard{display:none!important}
}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="searchWrap">
  <div id="searchBox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Найти страну или город…" autocomplete="off" spellcheck="false">
    <button id="qClear" aria-label="Очистить">×</button>
  </div>
  <div id="results"></div>
  <div id="ccard" style="position:relative"></div>
</div>

<aside id="cityPanel" aria-live="polite"></aside>

<div id="zoomCtl">
  <button id="zin" title="Приблизить">+</button>
  <button id="zout" title="Отдалить">−</button>
  <button id="zhome" title="Весь мир">⌂</button>
</div>

<div id="news"></div>
<div id="hud"></div>
<div id="server"></div>
<div id="banner"></div>
<div id="toast"></div>

<script type="module">
import {RULES, RoomCore, prepareData, cityView, moneyAt, nukeStage, warheads, nukeStageCost, nukeStageMs, baseIncome, econCost, armyCap, distKm, makeBot} from './game.js';
const T = 256;                                   // world size in "world units" (web-mercator)
const $ = s => document.querySelector(s);
const canvas = $('#map'), ctx = canvas.getContext('2d');
const hitCtx = document.createElement('canvas').getContext('2d');
let W = 0, H = 0, DPR = 1;
let view = {k: 4, tx: 0, ty: 0};
let countries = [], cities = [], byIso = new Map(), citiesBy = new Map();
let hoverCountry = null, hoverCity = null, selCountry = null, selCity = null;

/* ---------------- formatting ---------------- */
const nf = new Intl.NumberFormat('ru-RU');
const fmtInt = n => nf.format(Math.round(n));
function fmtPop(n){
  if (n >= 1e9) return (n/1e9).toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' млрд';
  if (n >= 1e6) return (n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:n>=1e7?1:2}) + ' млн';
  if (n >= 1e4) return (n/1e3).toLocaleString('ru-RU',{maximumFractionDigits:0}) + ' тыс.';
  return fmtInt(n);
}
function fmtMoney(md){ // millions USD
  if (md >= 1e6) return '$' + (md/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' трлн';
  if (md >= 1e3) return '$' + (md/1e3).toLocaleString('ru-RU',{maximumFractionDigits:md>=1e5?0:1}) + ' млрд';
  return '$' + fmtInt(md) + ' млн';
}
const pct = (x,d=1) => (x*100).toLocaleString('ru-RU',{maximumFractionDigits:d}) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flag = i2 => (i2 && /^[A-Z]{2}$/.test(i2)) ? String.fromCodePoint(...[...i2].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🏳️';
const norm = s => (s||'').toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[-‐–—'’`]/g,' ').replace(/\s+/g,' ').trim();

const CONT = {'Asia':'Азия','Africa':'Африка','Europe':'Европа','North America':'Северная Америка','South America':'Южная Америка',
  'Oceania':'Океания','Antarctica':'Антарктида','Seven seas (open ocean)':'Открытый океан'};
const SUB = {'Antarctica':'Антарктида','Australia and New Zealand':'Австралия и Новая Зеландия','Caribbean':'Карибский бассейн',
  'Central America':'Центральная Америка','Central Asia':'Центральная Азия','Eastern Africa':'Восточная Африка','Eastern Asia':'Восточная Азия',
  'Eastern Europe':'Восточная Европа','Melanesia':'Меланезия','Micronesia':'Микронезия','Middle Africa':'Центральная Африка',
  'Northern Africa':'Северная Африка','Northern America':'Северная Америка','Northern Europe':'Северная Европа','Polynesia':'Полинезия',
  'Seven seas (open ocean)':'Открытый океан','South America':'Южная Америка','South-Eastern Asia':'Юго-Восточная Азия',
  'Southern Africa':'Южная Африка','Southern Asia':'Южная Азия','Southern Europe':'Южная Европа','Western Africa':'Западная Африка',
  'Western Asia':'Западная Азия','Western Europe':'Западная Европа'};
const ECO = {1:['Развитая экономика, G7',100],2:['Развитая экономика',90],3:['Развивающаяся, БРИК',60],4:['Развивающаяся, группа MIKT',55],
  5:['Развивающаяся, G20',50],6:['Развивающаяся экономика',30],7:['Наименее развитая экономика',5]};
const INC = {1:['Высокий доход (ОЭСР)',100],2:['Высокий доход',85],3:['Доход выше среднего',60],4:['Доход ниже среднего',35],5:['Низкий доход',10]};
const TYPE = {'Sovereign country':'Суверенное государство','Country':'Государство','Sovereignty':'Суверенное государство',
  'Dependency':'Зависимая территория','Disputed':'Спорная территория','Indeterminate':'Статус не определён'};

/* ---------------- projection ---------------- */
const px = lon => (lon + 180) / 360 * T;
const py = lat => { lat = Math.max(-85.05, Math.min(85.05, lat)); const s = Math.sin(lat*Math.PI/180); return (0.5 - Math.log((1+s)/(1-s)) / (4*Math.PI)) * T; };
const ulon = x => x / T * 360 - 180;
const ulat = y => { const n = Math.PI - 2*Math.PI*y/T; return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
const zoomLevel = () => Math.log2(view.k);

/* ---------------- geometry build ---------------- */
function ringPath(p, flatRing, bb){
  for (let i = 0; i < flatRing.length; i += 2){
    const x = px(flatRing[i]), y = py(flatRing[i+1]);
    if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
    if (bb){ if (x<bb[0])bb[0]=x; if (y<bb[1])bb[1]=y; if (x>bb[2])bb[2]=x; if (y>bb[3])bb[3]=y; }
  }
  p.closePath();
}
function planarArea(flatRing){
  let s = 0; const n = flatRing.length;
  for (let i = 0; i < n; i += 2){
    const j = (i + 2) % n;
    s += px(flatRing[i]) * py(flatRing[j+1]) - px(flatRing[j]) * py(flatRing[i+1]);
  }
  return Math.abs(s)/2;
}
function sphereAreaKm2(flatRing){
  const R = 6371.0088, rad = Math.PI/180; let s = 0; const n = flatRing.length;
  for (let i = 0; i < n; i += 2){
    const j = (i + 2) % n;
    s += (flatRing[j] - flatRing[i]) * rad * (2 + Math.sin(flatRing[i+1]*rad) + Math.sin(flatRing[j+1]*rad));
  }
  return Math.abs(s * R * R / 2);
}
// Douglas–Peucker on a flat [x,y,...] array in world units
function simplify(a, tol){
  const n = a.length / 2; if (n < 6) return a;
  const keep = new Uint8Array(n); keep[0] = keep[n-1] = 1;
  const st = [0, n-1], t2 = tol * tol;
  while (st.length){
    const j = st.pop(), i = st.pop();
    const ax = a[2*i], ay = a[2*i+1], dx = a[2*j] - ax, dy = a[2*j+1] - ay, L = dx*dx + dy*dy;
    let best = -1, bi = -1;
    for (let m = i + 1; m < j; m++){
      const qx = a[2*m] - ax, qy = a[2*m+1] - ay;
      let d;
      if (L === 0) d = qx*qx + qy*qy; else { let t = (qx*dx + qy*dy) / L; t = t < 0 ? 0 : t > 1 ? 1 : t; d = (qx - t*dx) ** 2 + (qy - t*dy) ** 2; }
      if (d > best){ best = d; bi = m; }
    }
    if (best > t2){ keep[bi] = 1; st.push(i, bi, bi, j); }
  }
  const out = []; for (let m = 0; m < n; m++) if (keep[m]) out.push(a[2*m], a[2*m+1]);
  return out;
}
const LOD_Z = [3, 4, 5, 6];                          // detail levels: below each zoom use a simplified outline
const LOD_TOL = [0.6 / Math.pow(2, 2.3), 0.6 / Math.pow(2, 3), 0.6 / Math.pow(2, 4), 0.6 / Math.pow(2, 5)];
function cpath(c, z){ for (let i = 0; i < LOD_Z.length; i++) if (z < LOD_Z[i]) return c.lod[i]; return c.path; }
function buildLod(c){
  c.lod = LOD_TOL.map(tol => {
    const p = new Path2D();
    for (const poly of c.g) poly.forEach((r, k) => {
      const w = new Array(r.length); for (let i = 0; i < r.length; i += 2){ w[i] = px(r[i]); w[i+1] = py(r[i+1]); }
      const sw = simplify(w, tol);
      if (sw.length < 6) return;
      // drop specks smaller than a pixel at this level
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (let i = 0; i < sw.length; i += 2){ x0 = Math.min(x0, sw[i]); x1 = Math.max(x1, sw[i]); y0 = Math.min(y0, sw[i+1]); y1 = Math.max(y1, sw[i+1]); }
      if (k > 0 && Math.max(x1 - x0, y1 - y0) < tol * 2) return;
      p.moveTo(sw[0], sw[1]); for (let i = 2; i < sw.length; i += 2) p.lineTo(sw[i], sw[i+1]); p.closePath();
    });
    return p;
  });
}
function buildCountry(c, idx){
  c.idx = idx;
  c.path = new Path2D();
  c.bb = [Infinity, Infinity, -Infinity, -Infinity];
  c.area = 0;
  let best = 0; const parts = [];
  for (const poly of c.g){
    const bb = [Infinity, Infinity, -Infinity, -Infinity];
    poly.forEach((r, k) => { ringPath(c.path, r, k===0?bb:null); c.area += (k===0?1:-1) * sphereAreaKm2(r); });
    const a = planarArea(poly[0]);
    parts.push({bb, a}); if (a > best) best = a;
    c.bb[0]=Math.min(c.bb[0],bb[0]); c.bb[1]=Math.min(c.bb[1],bb[1]); c.bb[2]=Math.max(c.bb[2],bb[2]); c.bb[3]=Math.max(c.bb[3],bb[3]);
  }
  // "focus" box: main parts only (so France isn't zoomed to include Guiana, etc.)
  const fb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const p of parts) if (p.a >= best * 0.2){ fb[0]=Math.min(fb[0],p.bb[0]); fb[1]=Math.min(fb[1],p.bb[1]); fb[2]=Math.max(fb[2],p.bb[2]); fb[3]=Math.max(fb[3],p.bb[3]); }
  c.fb = fb;
  c.hue = (idx * 137.508 + 20) % 360;
  c.sat = 48 + (idx * 7919 % 17);
  c.fill = `hsl(${c.hue.toFixed(1)} ${c.sat}% 77%)`;
  c.fillSel = `hsl(${c.hue.toFixed(1)} ${c.sat + 6}% 82%)`;
  c.lwx = px(c.lx); c.lwy = py(c.ly);
  c.gdppc = (c.gdp > 0 && c.pop > 0) ? c.gdp * 1e6 / c.pop : null;
  const e = parseInt(c.eco), i = parseInt(c.inc);
  c.ecoN = e; c.incN = i;
  if (c.gdppc){
    const g = Math.max(0, Math.min(100, (Math.log10(c.gdppc) - Math.log10(500)) / (Math.log10(100000) - Math.log10(500)) * 100));
    c.dev = Math.round(0.5 * g + 0.3 * (INC[i] ? INC[i][1] : 40) + 0.2 * (ECO[e] ? ECO[e][1] : 40));
  } else c.dev = null;
  c.key = norm(c.ru) + ' | ' + norm(c.en) + ' | ' + (c.i2||'').toLowerCase() + ' | ' + (c.i3||'').toLowerCase();
}
function devLabel(v){ return v==null ? '—' : v>=80?'очень высокий':v>=62?'высокий':v>=45?'средний':v>=28?'ниже среднего':'низкий'; }

// seeded random for approximate city outlines
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
function cityOutline(c){
  if (c.outline) return c.outline;
  const p = new Path2D(); const bb = [Infinity, Infinity, -Infinity, -Infinity];
  if (c.b){
    c.b.forEach(r => ringPath(p, r, bb));
    c.approx = false;
  } else {
    // approximate area from population (~2 800 people per km²)
    const area = Math.max(6, c.p / 2800), rKm = Math.sqrt(area / Math.PI);
    const R = rng(c.id), ph = [R()*6.28, R()*6.28, R()*6.28], am = [0.10 + R()*0.08, 0.06 + R()*0.06, 0.04 + R()*0.04];
    const pts = []; const N = 40;
    for (let i = 0; i < N; i++){
      const t = i / N * Math.PI * 2;
      const rr = rKm * (1 + am[0]*Math.sin(2*t+ph[0]) + am[1]*Math.sin(3*t+ph[1]) + am[2]*Math.sin(5*t+ph[2]));
      pts.push(c.lo + rr * Math.cos(t) / (111.32 * Math.cos(c.la*Math.PI/180)), c.la + rr * Math.sin(t) / 111.32);
    }
    ringPath(p, pts, bb);
    c.approx = true; c.estArea = area;
  }
  c.outline = p; c.obb = bb;
  return p;
}

const LINE_MIN_PX = 100;
function cityLines(c){
  if (c.lp) return c.lp;
  const p = new Path2D(), L = c.lines;
  for (let i = 0; i < L.length; i += 4){ p.moveTo(px(L[i]), py(L[i+1])); p.lineTo(px(L[i+2]), py(L[i+3])); }
  return (c.lp = p);
}
function territory(x){
  if (x.tpath || !x.cell) return x.tpath;
  const p = new Path2D(), bb = [Infinity, Infinity, -Infinity, -Infinity];
  for (const poly of x.cell.g) for (const r of poly) ringPath(p, r, bb);
  x.tpath = p; x.tbb = bb;
  return p;
}
// the city whose territory contains a point = the nearest city of that country (territories are built that way)
function nearestCity(k, wx, wy){
  const list = citiesBy.get(k.i2); if (!list) return null;
  const shift = v => (k.span && v < T * (150 / 360)) ? v + T : v;   // countries crossing the 180° line
  const qx = shift(wx);
  let best = null, bd = Infinity;
  for (const x of list){ if (!x.ta) continue; const d = (shift(x.wx) - qx) ** 2 + (x.wy - wy) ** 2; if (d < bd){ bd = d; best = x; } }
  return best;
}

/* ---------------- view helpers ---------------- */
function clampView(){
  const minK = Math.max(W / T, H / (T * 0.86)) * 0.9;
  view.k = Math.max(minK, Math.min(view.k, 1 << 14));
  const ww = T * view.k;
  if (ww <= W) view.tx = (W - ww) / 2; else view.tx = Math.min(0, Math.max(W - ww, view.tx));
  const top = py(84) * view.k, bot = py(-75) * view.k;
  if (bot - top <= H) view.ty = (H - (bot + top)) / 2;
  else view.ty = Math.min(-top, Math.max(H - bot, view.ty));
}
const toScreen = (x, y) => [x * view.k + view.tx, y * view.k + view.ty];
const toWorld = (sx, sy) => [(sx - view.tx) / view.k, (sy - view.ty) / view.k];
function fitBox(bb, pad = 60){
  const bw = Math.max(bb[2]-bb[0], 1e-4), bh = Math.max(bb[3]-bb[1], 1e-4);
  const leftPad = W > 760 ? 380 : 16, rightPad = (selCity && W > 640) ? 400 : pad;
  const aw = Math.max(100, W - leftPad - rightPad), ah = Math.max(100, H - pad*2);
  let k = Math.min(aw / bw, ah / bh);
  k = Math.min(k, 1 << 13);
  const cx = (bb[0]+bb[2])/2, cy = (bb[1]+bb[3])/2;
  return {k, tx: leftPad + aw/2 - cx*k, ty: pad + ah/2 - cy*k};
}
let anim = null;
function flyTo(target, ms = 750){
  const from = {...view};
  const t0 = performance.now();
  // interpolate in "center + log zoom" space for a smooth feel
  const cF = toWorld(W/2, H/2);
  const cT = [(W/2 - target.tx)/target.k, (H/2 - target.ty)/target.k];
  const lF = Math.log(from.k), lT = Math.log(target.k);
  cancelAnimationFrame(anim);
  const step = now => {
    let t = Math.min(1, (now - t0) / ms); const e = t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    const k = Math.exp(lF + (lT - lF) * e);
    const cx = cF[0] + (cT[0]-cF[0]) * e, cy = cF[1] + (cT[1]-cF[1]) * e;
    view.k = k; view.tx = W/2 - cx*k; view.ty = H/2 - cy*k;
    clampView(); poke(); if (t >= 1) draw(); else render();
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function zoomAt(sx, sy, factor){
  const [wx, wy] = toWorld(sx, sy);
  view.k *= factor; clampView();
  view.tx = sx - wx * view.k; view.ty = sy - wy * view.k; clampView();
  poke(); schedule();
}

/* ---------------- drawing ---------------- */
// While the map is being moved we redraw from a snapshot (cheap) and do a full redraw at most every ~90 ms
// and once the movement stops; this keeps dragging and zooming smooth on slow machines.
const snap = document.createElement('canvas'), snapCtx = snap.getContext('2d');
let snapView = null, lastFull = 0, interactUntil = 0, settleTimer = 0, rafPending = false;
function interacting(){ return performance.now() < interactUntil; }
function poke(){ interactUntil = performance.now() + 140; clearTimeout(settleTimer); settleTimer = setTimeout(() => schedule(true), 160); }
function schedule(full){
  if (full) forceFull = true;
  if (rafPending) return; rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}
let forceFull = false;
function render(){
  const now = performance.now();
  if (!forceFull && interacting() && snapView && now - lastFull < 90){ blit(); return; }
  forceFull = false; draw();
}
function blit(){
  const r = view.k / snapView.k;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = getCss('--ocean'); ctx.fillRect(0, 0, W, H);
  ctx.setTransform(r, 0, 0, r, (view.tx - snapView.tx * r) * DPR, (view.ty - snapView.ty * r) * DPR);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(snap, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function saveSnap(){
  if (snap.width !== canvas.width || snap.height !== canvas.height){ snap.width = canvas.width; snap.height = canvas.height; }
  snapCtx.setTransform(1,0,0,1,0,0); snapCtx.clearRect(0, 0, snap.width, snap.height); snapCtx.drawImage(canvas, 0, 0);
  snapView = {...view}; lastFull = performance.now();
}
function popMin(z){ return 9e6 / Math.pow(2, (z - 2) * 1.75); }
function visibleCities(){
  const z = zoomLevel(), pm = popMin(z);
  const [x0, y0] = toWorld(-40, -40), [x1, y1] = toWorld(W + 40, H + 40);
  const out = [];
  for (const c of cities){
    if (c.wx < x0 || c.wx > x1 || c.wy < y0 || c.wy > y1) continue;
    if (c.p >= pm || (G.cc && c.c === G.cc && z >= 3 && c.r <= 30) || (z >= 3.2 && c.r === 1) || (z >= 4.3 && c.r <= 3) || (z >= 5.5 && c.r <= 12) || c === selCity || (selCountry && c.c === selCountry.i2 && z >= 4 && c.r <= 25)) out.push(c);
  }
  return out;
}
function dotR(c){ return 1.8 + Math.max(0, Math.log10(c.p / 1.5e4)) * 1.35; }

let shownCities = [];
function draw(){
  const k = view.k, z = zoomLevel();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = getCss('--ocean'); ctx.fillRect(0, 0, W, H);

  // graticule
  ctx.save();
  ctx.setTransform(k*DPR, 0, 0, k*DPR, view.tx*DPR, view.ty*DPR);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 0.8 / k;
  ctx.beginPath();
  for (let lon = -180; lon <= 180; lon += 30){ ctx.moveTo(px(lon), py(85)); ctx.lineTo(px(lon), py(-85)); }
  for (let lat = -60; lat <= 80; lat += 20){ ctx.moveTo(0, py(lat)); ctx.lineTo(T, py(lat)); }
  ctx.stroke();

  const [vx0, vy0] = toWorld(0, 0), [vx1, vy1] = toWorld(W, H);
  const inView = bb => !(bb[2] < vx0 || bb[0] > vx1 || bb[3] < vy0 || bb[1] > vy1);

  // land: one colour per country
  shownCities = visibleCities();
  const vis = [];
  for (const c of countries){
    if (!inView(c.bb)) continue;
    vis.push(c);
    ctx.fillStyle = countryFill(c);
    ctx.fill(cpath(c, z), 'evenodd');
  }
  // cities held by someone other than the country's ruler get their owner's colour
  for (const x of G.foreign){
    if (!territory(x) || !inView(x.tbb)) continue;
    const kk = byIso.get(x.c); if (kk && (kk.bb[2]-kk.bb[0]) * k < 25) continue;
    ctx.fillStyle = ownerFill(G.cities[x.id].o); ctx.fill(x.tpath, 'evenodd');
  }
  if (G.target && hoverCity && hoverCity.tpath){ ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill(hoverCity.tpath, 'evenodd'); }
  else if (hoverCountry && hoverCountry !== selCountry && !hoverCity){ ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(cpath(hoverCountry, z), 'evenodd'); }
  if (selCity && selCity.tpath){ ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(selCity.tpath, 'evenodd'); }
  // built-up areas (real satellite outlines), when zoomed in
  if (z >= 5.4){
    const alpha = Math.min(1, (z - 5.4) / 1.2);
    ctx.fillStyle = `rgba(40,30,25,${.13 * alpha})`; ctx.strokeStyle = `rgba(40,30,25,${.3 * alpha})`; ctx.lineWidth = .7 / k;
    for (const c of shownCities){
      if (!c.b) continue;
      const p = cityOutline(c);
      if (!inView(c.obb)) continue;
      ctx.fill(p, 'evenodd'); ctx.stroke(p);
    }
  }

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

/* ---------------- search ---------------- */
const q = $('#q'), res = $('#results');
let items = [], act = -1;
function doSearch(){
  const s = norm(q.value);
  $('#qClear').style.display = q.value ? 'block' : 'none';
  if (!s){ res.style.display = 'none'; items = []; return; }
  const cs = [];
  for (const c of countries){
    if (!c.i2 && !c.pop) continue;
    const i = c.key.indexOf(s);
    if (i < 0) continue;
    const score = (norm(c.ru).startsWith(s) ? 0 : norm(c.en).startsWith(s) ? 1 : c.key.includes(' ' + s) ? 2 : 3) * 1e12 - c.pop;
    cs.push([score, c]);
  }
  cs.sort((a, b) => a[0] - b[0]);
  const ct = [];
  if (s.length >= 2){
    for (const c of cities){
      const a = c.kn.startsWith(s) ? 0 : c.ke.startsWith(s) ? 1 : (c.kn.includes(s) || c.ke.includes(s)) ? 2 : -1;
      if (a < 0) continue;
      ct.push([a * 1e10 - c.p, c]);
    }
    ct.sort((a, b) => a[0] - b[0]);
  }
  items = []; let html = '';
  if (cs.length){ html += '<div class="grp">Страны</div>'; cs.slice(0, 6).forEach(([, c]) => { items.push({t:'c', v:c}); html += `<div class="it" data-i="${items.length-1}"><div class="fl">${flag(c.i2)}</div><div><div class="nm">${esc(c.ru)}</div><div class="sub">${esc(c.en)} · ${c.pop ? fmtPop(c.pop) + ' чел.' : ''}</div></div></div>`; }); }
  if (ct.length){ html += '<div class="grp">Города</div>'; ct.slice(0, 6).forEach(([, c]) => { items.push({t:'g', v:c}); const k = byIso.get(c.c); html += `<div class="it" data-i="${items.length-1}"><div class="fl">${flag(c.c)}</div><div><div class="nm">${esc(c.n)}</div><div class="sub">${esc(k ? k.ru : c.c)} · ${fmtPop(c.p)}</div></div></div>`; }); }
  if (!items.length) html = '<div class="empty">Ничего не нашлось. Попробуйте по-русски или по-английски.</div>';
  res.innerHTML = html; res.style.display = 'block'; act = items.length ? 0 : -1; markAct();
}
function markAct(){ res.querySelectorAll('.it').forEach((el, i) => el.classList.toggle('act', i === act)); }
function choose(i){
  const it = items[i]; if (!it) return;
  res.style.display = 'none'; q.blur();
  if (it.t === 'c'){ q.value = it.v.ru; closeCity(); selectCountry(it.v, true); }
  else { q.value = it.v.n; openCity(it.v, true); }
}
q.addEventListener('input', doSearch);
q.addEventListener('focus', () => { if (q.value) doSearch(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); act = Math.min(items.length - 1, act + 1); markAct(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); act = Math.max(0, act - 1); markAct(); }
  else if (e.key === 'Enter'){ e.preventDefault(); choose(act < 0 ? 0 : act); }
  else if (e.key === 'Escape'){ res.style.display = 'none'; q.blur(); }
});
res.addEventListener('mousedown', e => { const el = e.target.closest('.it'); if (el){ e.preventDefault(); choose(+el.dataset.i); } });
$('#qClear').onclick = () => { q.value = ''; doSearch(); q.focus(); };

function drawMini(c, list){
  const cv = $('#miniMap'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const m = cv.getContext('2d');
  const bb = c.fb, pad = 24;
  const bw = Math.max(bb[2]-bb[0], 1e-3), bh = Math.max(bb[3]-bb[1], 1e-3);
  const k = Math.min((r.width - pad*2) / bw, (r.height - pad*2) / bh);
  const tx = r.width/2 - (bb[0]+bb[2])/2*k, ty = r.height/2 - (bb[1]+bb[3])/2*k;
  m.setTransform(dpr, 0, 0, dpr, 0, 0); m.fillStyle = getCss('--ocean'); m.fillRect(0, 0, r.width, r.height);
  m.setTransform(k*dpr, 0, 0, k*dpr, tx*dpr, ty*dpr);
  const vb = [(0 - tx)/k, (0 - ty)/k, (r.width - tx)/k, (r.height - ty)/k];
  for (const o of countries){
    if (o.bb[2] < vb[0] || o.bb[0] > vb[2] || o.bb[3] < vb[1] || o.bb[1] > vb[3]) continue;
    m.fillStyle = o === c ? countryFill(o) : '#e6e3da'; m.fill(o.path, 'evenodd');
  }
  m.save(); m.clip(c.path, 'evenodd');
  if (c.lines){ m.strokeStyle = 'rgba(45,40,35,.45)'; m.lineWidth = 0.8 / k; m.stroke(cityLines(c)); }
  m.restore();
  m.strokeStyle = 'rgba(120,105,80,.5)'; m.lineWidth = 0.8 / k;
  for (const o of countries){ if (!(o.bb[2] < vb[0] || o.bb[0] > vb[2] || o.bb[3] < vb[1] || o.bb[1] > vb[3])) m.stroke(o.path); }
  m.strokeStyle = getCss('--sel'); m.lineWidth = 2 / k; m.stroke(c.path);
  m.setTransform(dpr, 0, 0, dpr, 0, 0);
  const maxP = list[0] ? list[0].p : 1;
  for (let i = list.length - 1; i >= 0; i--){
    const x = list[i], sx = x.wx * k + tx, sy = x.wy * k + ty;
    const rr = 1.5 + Math.sqrt(x.p / maxP) * 7;
    m.beginPath(); m.arc(sx, sy, rr, 0, Math.PI*2);
    const oc = G.cities[x.id] && G.cities[x.id].o;
    m.fillStyle = oc ? ownerColor(oc) : 'rgba(29,42,51,.85)'; m.fill(); m.lineWidth = 1.2; m.strokeStyle = '#fff'; m.stroke();
  }
  m.font = '700 12px Manrope, system-ui, sans-serif'; m.textBaseline = 'middle'; m.lineJoin = 'round';
  const occ = [];
  list.slice(0, 12).forEach(x => {
    const sx = x.wx * k + tx, sy = x.wy * k + ty, rr = 1.5 + Math.sqrt(x.p / maxP) * 7;
    const tw = m.measureText(x.n).width, lx = sx + rr + 3;
    if (lx + tw > r.width - 4 || occ.some(o => lx < o[0]+o[2]+4 && lx+tw+4 > o[0] && sy-8 < o[1]+16 && sy+8 > o[1])) return;
    occ.push([lx, sy - 8, tw, 16]);
    if (occ.length > 6) return;
    m.lineWidth = 3; m.strokeStyle = 'rgba(255,255,255,.9)'; m.strokeText(x.n, lx, sy); m.fillStyle = '#1d2a33'; m.fillText(x.n, lx, sy);
  });
}

/* ---------- connection: online (Cloudflare) or offline with bots ---------- */
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} return null; };
let ws = null, wsRoom = null, reconnectTimer = 0;
async function serverAvailable(){
  if (location.protocol === 'file:') return false;
  try { const r = await fetch('/api/rooms', {cache: 'no-store'}); if (!r.ok) return false; const j = await r.json(); return Array.isArray(j.rooms); } catch { return false; }
}
async function startOnline(name){
  setStartStatus('Ищу свободный сервер…');
  const exclude = [];
  for (let attempt = 0; attempt < 8; attempt++){
    let room;
    try { room = (await (await fetch('/api/join?exclude=' + exclude.join(','), {cache: 'no-store'})).json()).room; }
    catch { setStartStatus('Сервер недоступен. Попробуйте позже или сыграйте с ботами.'); return; }
    const r = await openSocket(room, name);
    if (r === 'full'){ exclude.push(room); setStartStatus(`Сервер ${room} заполнен (${RULES.CAP}/${RULES.CAP}) — перевожу в другую игру…`); continue; }
    if (r === 'ok') return;
    setStartStatus('Не удалось подключиться. Попробуйте ещё раз.'); return;
  }
  setStartStatus('Все серверы заняты, попробуйте чуть позже.');
}
function openSocket(room, name){
  return new Promise(resolve => {
    const sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/' + room);
    let settled = false;
    sock.onopen = () => sock.send(JSON.stringify({t: 'hello', name, token: store('md_token_' + room) || undefined}));
    sock.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'full'){ settled = true; try { sock.close(); } catch {} resolve('full'); return; }
      if (m.t === 'welcome' && !settled){ settled = true; ws = sock; wsRoom = room; G.send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); else toast('Нет связи с сервером…', 'err'); }; resolve('ok'); }
      onMsg(m);
    };
    sock.onclose = () => {
      if (!settled){ settled = true; resolve('error'); return; }
      if (ws === sock){ ws = null; toast('Связь потеряна, переподключаюсь…', 'err'); clearTimeout(reconnectTimer); reconnectTimer = setTimeout(() => openSocket(room, name).then(r => { if (r === 'full') startOnline(name); }), 2000); }
    };
    sock.onerror = () => {};
  });
}
function startOffline(name){
  G.offline = true;
  const room = new RoomCore(gameData, null, {name: 'офлайн'});
  const me = {send: m => setTimeout(() => onMsg(JSON.parse(JSON.stringify(m))), 0), close(){}};
  room.connect(me);
  G.send = m => room.message(me, m);
  const pool = ['CN', 'US', 'RU', 'IN', 'BR', 'DE', 'FR', 'JP', 'TR', 'IR', 'NG', 'EG', 'MX', 'ID', 'PK', 'GB', 'IT', 'ES', 'SA', 'UA', 'KZ', 'AR', 'ZA', 'KR'];
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const names = ['Наполеон', 'Цезарь', 'Шахиншах', 'Хан', 'Кайзер', 'Сёгун'];
  const bots = names.map((n, i) => makeBot(room, n + ' (бот)', pool[i]));
  setInterval(() => bots.forEach(b => b.step()), 3000);
  G.send({t: 'hello', name});
}

    <div class="h-it" title="Армия во всех городах">🪖 <b>${fmtShort(me.army || 0)}</b></div>
    <div class="h-it" title="Городов">🏙 <b>${me.nc || 0}</b></div>
    <button class="h-btn" id="hNuke" title="Ядерная программа">☢ <b>${st}/${RULES.NUKE_STAGES}</b>${wh ? `<small>🚀${wh}</small>` : ''}</button>
    <button class="h-btn" id="hBoard" title="Рейтинг игроков">🏆</button>`;
  $('#hNuke').onclick = () => togglePanel('nukePanel', renderNukePanel);
  $('#hBoard').onclick = () => togglePanel('board', renderBoard);
  renderServer();
}
function renderServer(){
  const el = $('#server');
  if (G.mode === 'start'){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = G.offline ? '🤖 Офлайн с ботами' : `🟢 Сервер ${esc(G.room || '')} · ${G.online}/${RULES.CAP}`;
}
setInterval(() => {
  const me = G.players[G.you]; if (!me || G.mode !== 'play') return;
  const el = $('#hMoney'); if (el) el.textContent = fmtInt(moneyAt(me, srvNow()));
  if ($('#nukePanel').classList.contains('open')) renderNukePanel();
  const now = srvNow();
  // finished research / warhead: refresh HUD once
  const key = nukeStage(me, now) + ':' + warheads(me, now);
  if (key !== G._nk){ G._nk = key; renderHud(); }
  if (selCity && !G.target && Date.now() - (G._pTick || 0) > 700){ G._pTick = Date.now(); renderCityPanel(); }
}, 250);
function togglePanel(id, render){
  const el = $('#' + id), open = !el.classList.contains('open');
  document.querySelectorAll('.side').forEach(x => x.classList.remove('open'));
  if (open){ render(); el.classList.add('open'); }
}
function renderNukePanel(){
  const me = G.players[G.you]; if (!me) return;
  const now = srvNow(), st = nukeStage(me, now), wh = warheads(me, now);
  const money = moneyAt(me, now);
  const researching = me.nu && now < me.nu;
  let body = `<div class="prog"><div style="width:${st / RULES.NUKE_STAGES * 100}%"></div></div>
    <div class="note" style="margin:6px 0 14px">Этап ${st} из ${RULES.NUKE_STAGES}${researching ? ` · идёт этап ${me.nt}: ещё ${fmtTime(me.nu - now)}` : ''}</div>`;
  if (st < RULES.NUKE_STAGES){
    const cost = nukeStageCost(st + 1);
    body += `<button class="act" id="nkR" ${researching || money < cost ? 'disabled' : ''}>🔬 Исследовать этап ${st + 1}<small>💰 ${fmtInt(cost)} · ${fmtTime(nukeStageMs(st + 1))}</small></button>`;
  } else {
    const building = me.wb && now < me.wb;
    body += `<div class="stat" style="margin-bottom:10px"><b>🚀 ${wh}</b><span>готовых боеголовок</span></div>
      <button class="act" id="nkW" ${building || money < RULES.WARHEAD_COST ? 'disabled' : ''}>🛠 Собрать боеголовку<small>${building ? 'готова через ' + fmtTime(me.wb - now) : '💰 ' + fmtInt(RULES.WARHEAD_COST) + ' · ' + fmtTime(RULES.WARHEAD_MS)}</small></button>
      <div class="note">Чтобы ударить, откройте вражеский город и нажмите «Ядерный удар». Удар уничтожает армию, половину населения и 3 уровня экономики.</div>`;
  }
  $('#nukePanel').innerHTML = `<button class="x" onclick="this.parentNode.classList.remove('open')">×</button><h3>☢ Ядерная программа</h3>${body}`;
  const r = $('#nkR'); if (r) r.onclick = () => G.send({t: 'act', a: {type: 'research'}});
  const w = $('#nkW'); if (w) w.onclick = () => G.send({t: 'act', a: {type: 'warhead'}});
}
function renderBoard(){
  const now = srvNow();
  const list = Object.values(G.players).filter(p => p.cc).sort((a, b) => b.rate - a.rate);
  $('#board').innerHTML = `<button class="x" onclick="this.parentNode.classList.remove('open')">×</button><h3>🏆 Рейтинг · ${list.length}</h3>
    <div class="blist">${list.map((p, i) => { const k = byIso.get(p.cc); return `<div class="brow${p.id === G.you ? ' me' : ''}" data-cc="${p.cc}">
      <span class="bn">${i + 1}</span><i class="dot" style="background:${p.color}"></i>
      <span class="bname">${esc(p.name)}<small>${k ? flag(k.i2) + ' ' + esc(k.ru) : ''}${p.on ? '' : ' · не в сети'}</small></span>
      <span class="bv">💰${fmtNum(p.rate)}/с<small>🏙${p.nc} · 🪖${fmtShort(p.army || 0)}${nukeStage(p, now) >= RULES.NUKE_STAGES ? ' · ☢' : ''}</small></span></div>`; }).join('') || '<div class="note">Пока никто не выбрал страну.</div>'}</div>`;
  $('#board').querySelectorAll('.brow').forEach(el => el.onclick = () => { const k = byIso.get(el.dataset.cc); if (k){ selectCountry(k, true); } });
}
function renderNews(fresh){
  const box = $('#news');
  const items = G.news.slice(-6).reverse();
  box.style.display = items.length && G.mode !== 'start' ? 'block' : 'none';
  box.innerHTML = items.map(n => `<div class="nw ${n.k}">${esc(n.txt)}</div>`).join('');
  if (fresh) for (const n of fresh) if (n.k === 'nuke' && n.txt.startsWith('☢')) toast(n.txt, 'nuke');
}
let toastT = 0;
function toast(t, kind){
  const el = $('#toast'); el.textContent = t; el.className = 'show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => el.className = '', kind === 'err' ? 3200 : 4200);
}

/* ---------- attack / transfer / nuke ---------- */
function startTarget(kind, from){
  G.target = {kind, from};
  $('#banner').style.display = 'block';
  $('#banner').innerHTML = kind === 'move'
    ? `➜ <b>Переброска из «${esc(from.n)}»</b>: нажмите на свой город в синем круге · <a href="#" id="bCancel">отмена</a>`
    : `⚔ <b>Атака из «${esc(from.n)}»</b>: нажмите на город врага в красном круге · <a href="#" id="bCancel">отмена</a>`;
  $('#bCancel').onclick = e => { e.preventDefault(); cancelTarget(); };
  schedule(true);
}
function cancelTarget(){ G.target = null; $('#banner').style.display = G.mode === 'choose' ? 'block' : 'none'; schedule(true); }
function pickTarget(c){
  const t = G.target; if (!t) return;
  const own = G.cities[c.id] && G.cities[c.id].o === G.you;
  if (t.kind === 'move'){ if (!own || c === t.from) return toast('Выберите другой свой город', 'err'); cancelTarget(); openMove(t.from, c); }
  else { if (own) return toast('Это ваш город — выберите чужой', 'err'); cancelTarget(); openAttack(t.from, c); }
}
function ownCitiesInRange(target, km){
  const out = [];
  for (const id in G.cities){
    const e = G.cities[id]; if (e.o !== G.you || e.a < 2) continue;
    const c = cityById.get(+id); if (!c || c === target) continue;
    const d = distKm(c, target); if (d <= km) out.push({c, a: e.a, d});
  }
  return out.sort((a, b) => b.a - a.a);
}
function openAttack(from, target){
  const srcs = ownCitiesInRange(target, RULES.RANGE_KM);
  if (!srcs.length) return toast(`Нет ваших городов с армией ближе ${RULES.RANGE_KM} км`, 'err');
  let cur = (from && srcs.find(s => s.c === from)) || srcs[0];
  if (from && !srcs.find(s => s.c === from)) toast(`«${from.n}» слишком далеко, выбран ближайший город`, 'err');
  const tv = cityView(G, gameData, target.id), owner = tv.o ? G.players[tv.o] : null;
  const body = () => {
    const max = cur.a - 1;
    return `<h3>⚔ Атака на «${esc(target.n)}»</h3>
      <div class="note">${owner ? 'Владелец: ' + esc(owner.name) : 'Нейтральный город'} · защитников: <b>${fmtInt(tv.a)}</b>${target.cap && owner && G.taken[target.c] === tv.o ? ' (столица: +25% к обороне)' : ''}</div>
      <label class="fld">Откуда<select id="mSrc">${srcs.map((s, i) => `<option value="${i}" ${s === cur ? 'selected' : ''}>${esc(s.c.n)} — 🪖${fmtInt(s.a)} · ${Math.round(s.d)} км</option>`).join('')}</select></label>
      <label class="fld">Сколько солдат: <b id="mN">${fmtInt(max)}</b><input type="range" id="mR" min="1" max="${max}" value="${max}"></label>
      <div class="note" id="mHint"></div>
      <div class="row2"><button class="act" id="mCancel">Отмена</button><button class="act red" id="mGo">В атаку!</button></div>`;
  };
  const wire = () => {
    const hint = () => { const n = +$('#mR').value; $('#mN').textContent = fmtInt(n); const def = tv.a * (target.cap && owner && G.taken[target.c] === tv.o ? 1.25 : 1);
      $('#mHint').innerHTML = n > def ? '✅ Сил хватает — город будет захвачен' : '⚠️ Сил не хватает — атака, скорее всего, будет отбита'; };
    $('#mR').oninput = hint; hint();
    $('#mSrc').onchange = () => { cur = srcs[+$('#mSrc').value]; showModal(body(), wire); };
    $('#mCancel').onclick = closeModal;
    $('#mGo').onclick = () => { G.send({t: 'act', a: {type: 'attack', from: cur.c.id, to: target.id, n: +$('#mR').value}}); closeModal(); };
  };
  showModal(body(), wire);
}
function openMove(from, to){
  const fe = G.cities[from.id]; const max = fe.a - 1;
  const d = distKm(from, to);
  if (d > RULES.RANGE_KM * 1.5) return toast(`Слишком далеко: ${Math.round(d)} км`, 'err');
  showModal(`<h3>➜ Переброска войск</h3><div class="note">${esc(from.n)} → ${esc(to.n)} · ${Math.round(d)} км</div>
    <label class="fld">Сколько солдат: <b id="mN">${fmtInt(max)}</b><input type="range" id="mR" min="1" max="${max}" value="${max}"></label>
    <div class="row2"><button class="act" id="mCancel">Отмена</button><button class="act blue" id="mGo">Перебросить</button></div>`, () => {
    $('#mR').oninput = () => $('#mN').textContent = fmtInt(+$('#mR').value);
    $('#mCancel').onclick = closeModal;
    $('#mGo').onclick = () => { G.send({t: 'act', a: {type: 'move', from: from.id, to: to.id, n: +$('#mR').value}}); closeModal(); };
  });
}
function openNuke(target){
  showModal(`<h3>☢ Ядерный удар</h3><div class="note">Цель: <b>${esc(target.n)}</b>. Удар уничтожит всю армию города, половину населения и 3 уровня экономики. Об этом узнают все игроки.</div>
    <div class="row2"><button class="act" id="mCancel">Отмена</button><button class="act nuke" id="mGo">Запуск</button></div>`, () => {
    $('#mCancel').onclick = closeModal;
    $('#mGo').onclick = () => { G.send({t: 'act', a: {type: 'nuke', to: target.id}}); closeModal(); };
  });
}
function showModal(html, wire){ $('#modalBox').innerHTML = html; $('#modal').classList.add('open'); wire && wire(); }
function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- start screen ---------- */
async function initStart(){
  setMode('start');
  const nameIn = $('#pName'); nameIn.value = store('md_name') || '';
  const online = await serverAvailable();
  $('#bOnline').style.display = online ? 'block' : 'none';
  $('#bOffline').classList.toggle('ghost', online);
  setStartStatus(online ? `До ${RULES.CAP} игроков на сервере. Если он заполнен — вас переведёт в другую игру.` : 'Онлайн-сервер появится, когда игру выложат на Cloudflare. Пока можно сыграть с ботами.');
  const go = mode => {
    const name = nameIn.value.trim().slice(0, 20) || 'Игрок';
    store('md_name', name);
    if (mode === 'online') startOnline(name); else startOffline(name);
  };
  $('#bOnline').onclick = () => go('online');
  $('#bOffline').onclick = () => go('offline');
  nameIn.onkeydown = e => { if (e.key === 'Enter') go(online ? 'online' : 'offline'); };
}

/* ---------------- resize & boot ---------------- */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, W * H > 1.6e6 ? 1.5 : 2);
  canvas.width = W * DPR; canvas.height = H * DPR;
  clampView(); draw();
  if (cpCountry) drawMini(cpCountry, citiesBy.get(cpCountry.i2) || []);
}
window.addEventListener('resize', resize);

async function boot(){
  try {
    const [a, b, l] = await Promise.all(['countries', 'cities', 'lines'].map(n => fetch('data/' + n + '.json').then(r => r.json())));
    countries = a; cities = b;
    for (const c of countries) if (l[c.i3]) c.lines = l[c.i3];
  } catch (err){
    $('#loading').innerHTML = '<div>Не удалось загрузить данные карты. Обновите страницу.</div>'; return;
  }
  countries.forEach(buildCountry);
  countries.forEach(buildLod);
  // biggest first so small enclaves inside big countries aren't hidden from hit test: test smaller first
  for (const c of countries) if (c.i2 && !byIso.has(c.i2)) byIso.set(c.i2, c);
  for (const c of cities){
    c.wx = px(c.lo); c.wy = py(c.la);
    c.kn = norm(c.n); c.ke = norm(c.e);
    cityById.set(c.id, c);
    if (!citiesBy.has(c.c)) citiesBy.set(c.c, []);
    citiesBy.get(c.c).push(c);
  }
  for (const l of citiesBy.values()) l.sort((a, b) => a.r - b.r);
  // draw order: land fill from big to small so small islands sit on top
  countries.sort((a, b) => (b.bb[2]-b.bb[0])*(b.bb[3]-b.bb[1]) - (a.bb[2]-a.bb[0])*(a.bb[3]-a.bb[1]));
  hitOrder = countries.slice().reverse();
  W = window.innerWidth; H = window.innerHeight;
  view = homeView();
  resize();
  gameData = prepareData({c: cities.map(c => [c.id, c.c, c.p, c.la, c.lo, c.cap === 1 ? 1 : 0, c.n]), n: Object.fromEntries(countries.filter(c => c.i2).map(c => [c.i2, c.ru]))});
  $('#loading').style.display = 'none';
  initStart();
  // territory shapes are only needed for highlighting the chosen city: load them after the map is up
  fetch('data/cells.json').then(r => r.json()).then(t => {
    for (const c of cities){ const cell = t[c.id]; if (cell) c.cell = cell; }
    if (selCity){ territory(selCity); } schedule(true);
  }).catch(() => {});
  if (document.fonts) document.fonts.ready.then(() => { measureCache.clear(); schedule(); });
}
boot();
</script>
